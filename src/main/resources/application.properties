spring.application.name=trustdesk

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/trustdesk
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.tool.schema=DEBUG

management.endpoints.web.exposure.include=health,info

# =========================================================
# AI PROVIDER
# =========================================================

# Keep MOCK for evaluation/testing.
# Change to gemini only after the baseline is verified.
trustdesk.ai.provider=mock


# =========================================================
# GEMINI
# =========================================================

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models